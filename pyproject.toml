[project]
name = "aws-finops-toolkit"
version = "0.1.0"
description = "Read-only AWS cost audit: deterministic waste detection, code-computed savings, Claude-narrated report."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Botond Geiszt" }]
dependencies = [
    "pydantic>=2.7",
    "boto3>=1.34",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
finops-toolkit = "finops_toolkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "moto[ec2,s3,elbv2]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finops_toolkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
